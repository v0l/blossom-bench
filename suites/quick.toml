[run]
server_cpus = "0-3"
load_cpus = "16-31"
service_cpus = "8-11"
connections = 32
duration_s = 3
warmup_s = 1
verify = 8

[[workload]]
name = "put-1k"
kind = "upload"
size = 1024
count = 400

[[workload]]
name = "get-1k"
kind = "get"
blobs = ["put-1k"]

[[workload]]
name = "miss"
kind = "miss"
blobs = ["put-1k"]
