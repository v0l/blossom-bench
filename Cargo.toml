[package]
name = "blossom-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
hdrhistogram = "7.6.0"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
ramhorns = "1.0.1"
secp256k1 = { version = "0.33.1", features = ["rand"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "time", "macros", "process", "sync", "io-util"] }
toml = "1.1.8"
