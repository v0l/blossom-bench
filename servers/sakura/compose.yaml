services:
  server:
    extends: {file: ../common.yaml, service: app}
    build:
      context: "https://relay.ngit.dev/npub1ven4zk8xxw873876gx8y9g9l9fazkye9qnwnglcptgvfwxmygscqsxddfh/Sakura.git"
      dockerfile_inline: |
        FROM debian:bookworm-slim AS build
        RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates curl clang lld libc6-dev && rm -rf /var/lib/apt/lists/*
        WORKDIR /opt/odin
        RUN curl -fsSL -o /tmp/odin.tar.gz https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-linux-amd64-dev-2026-10.tar.gz && tar xzf /tmp/odin.tar.gz -C /opt/odin --strip-components=1 && rm /tmp/odin.tar.gz
        ENV PATH="/opt/odin:$${PATH}"
        WORKDIR /src
        COPY . .
        RUN odin build . -out:/usr/local/bin/sakura -o:speed -extra-linker-flags:"-static" && strip /usr/local/bin/sakura
        FROM debian:bookworm-slim
        COPY --from=build /usr/local/bin/sakura /usr/local/bin/sakura
    image: bb-sakura:bench
    command: ["sakura"]
    environment:
      SAKURA_HOST: "127.0.0.1"
      SAKURA_PORT: "${BB_PORT}"
      SAKURA_DATA: "/data/blobs"
      SAKURA_PUBLIC_URL: "http://127.0.0.1:${BB_PORT}"
      SAKURA_MAX_MB: "2048"
      SAKURA_WORKERS: "4"
      SAKURA_REQUIRE_AUTH: "true"
