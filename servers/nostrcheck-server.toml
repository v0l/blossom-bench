name = "nostrcheck-server"
port = 18107
notes = "quentintaranpino/nostrcheck-server published image, Node + MariaDB + Redis; security module (rate limiting) disabled, bench key registered, uploads go through /api/v2/media/upload which answers 202 and processes in the background; a missing hash returns 200 with a placeholder image, so the miss workload cannot pass"
ready_path = "/api/v2/media"

[image]
prebuilt = "nostrcheckme/nostrcheck-server:latest"

[[services]]
name = "mariadb"
image = "mariadb:latest"
args = ["--bind-address=127.0.0.1"]
env = { MARIADB_ROOT_PASSWORD = "root", MARIADB_DATABASE = "nostrcheck" }
ready_cmd = "mariadb -uroot -proot -e 'select 1'"

[[services]]
name = "redis"
image = "redis:7-alpine"
args = ["redis-server", "--bind", "127.0.0.1", "--save", ""]
ready_cmd = "redis-cli ping"

[[files]]
path = "{data}/config/local.json"
content = """
{
  "server": {"host": "127.0.0.1", "port": {port}, "tosFilePath": "resources/tos.md", "privacyFilePath": "resources/privacy.md", "availableModules": {"security": {"enabled": false}}},
  "database": {"host": "127.0.0.1", "user": "root", "password": "root", "database": "nostrcheck"},
  "storage": {"local": {"mediaPath": "{data}/files/", "tempPath": "{data}/tmp/"}},
  "logger": {"logPath": "{data}/logs/"},
  "security": {"media": {"maxUploadsMinute": 100000000}, "maxDefaultRequestMinute": 100000000}
}
"""

[[after_ready]]
service = "mariadb"
cmd = "mariadb -uroot -proot nostrcheck -e \"insert into registered (pubkey, hex, username, password, domain, active, date, allowed, checked) values ('{pubkey}', '{pubkey}', 'bench', '', '127.0.0.1', 1, now(), 1, 1)\""

[run]
entrypoint = "sh"
cmd = ["-c", "mkdir -p {data}/files {data}/tmp {data}/logs && cd /usr/src/app && for i in 1 2 3; do npm start; done"]
mounts = ["{data}/config:/usr/src/app/config"]
env = { HOME = "{data}" }
startup_timeout_s = 240

[upload]
path = "/api/v2/media/upload"
content_type = "text/plain"
settle_s = 40
