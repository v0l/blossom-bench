name = "ditto-blossom"
port = 18102
notes = "LMDB metadata, sendfile for large blobs, fsync before every upload ack"

[source]
git = "https://github.com/soapbox-pub/ditto-blossom.git"

[image]
dockerfile_inline = """
FROM rust:1-bookworm AS build
WORKDIR /src
COPY . .
RUN cargo build --release 
FROM debian:bookworm-slim
RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates libssl3 && rm -rf /var/lib/apt/lists/*
COPY --from=build /src/target/release/ditto-blossom /usr/local/bin/ditto-blossom
"""

[[files]]
path = "{data}/config.toml"
content = """
listen = "127.0.0.1:{port}"
data = "{data}/store"
public_url = "http://127.0.0.1:{port}"
[upload]
require_auth = true
max_size = 2147483648
per_minute = 100000000
"""

[run]
cmd = ["ditto-blossom", "-c", "{data}/config.toml"]
