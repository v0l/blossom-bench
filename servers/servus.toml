name = "servus"
port = 18108
notes = "servus-social/servus, a Rust CMS and relay with a small Blossom server, flat files on disk. Only PNG/JPEG/GIF/WebP/MP3 are accepted, so uploads carry a PNG header. Reads the whole blob per GET"
ready_path = "/?bench.local"

[source]
git = "https://github.com/servus-social/servus.git"

[image]
dockerfile_inline = """
FROM rust:1-bookworm AS build
RUN apt-get update && apt-get install -y --no-install-recommends pkg-config libssl-dev cmake clang && rm -rf /var/lib/apt/lists/*
WORKDIR /src
COPY . .
RUN cargo build --release
FROM debian:bookworm-slim
RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates libssl3 curl unzip && rm -rf /var/lib/apt/lists/*
COPY --from=build /src/target/release/servus /usr/local/bin/servus
RUN mkdir -p /themes && curl -sSL -o /t.zip https://github.com/servus-social/themes/releases/latest/download/themes.zip && unzip -q /t.zip -d /themes && rm /t.zip
"""

[[files]]
path = "{data}/sites/bench.local/_config.toml"
content = """
base_url = "http://bench.local"
pubkey = "{pubkey}"
theme = "DeepThought"
"""

[run]
cmd = ["servus", "--sites-dir", "{data}/sites", "--themes-dir", "/themes", "--cache-dir", "{data}/cache", "--state-dir", "{data}/state", "-b", "127.0.0.1", "-p", "{port}"]
env = { RUST_LOG = "warn" }
startup_timeout_s = 120

[upload]
content = "png"
