name = "blossom-rs"
port = 18105
notes = "MonumentalSystems/blossom-rs, SQLite metadata, rate limiter and locks off; buffers whole bodies in RAM with a fixed buffer budget"

[source]
git = "https://github.com/MonumentalSystems/blossom-rs.git"

[image]
dockerfile_inline = """
FROM rust:1-bookworm AS build
WORKDIR /src
COPY . .
RUN cargo build --release -p blossom-server
FROM debian:bookworm-slim
RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates libssl3 && rm -rf /var/lib/apt/lists/*
COPY --from=build /src/target/release/blossom-server /usr/local/bin/blossom-server
"""

[run]
cmd = ["blossom-server", "--bind", "127.0.0.1:{port}", "--base-url", "http://127.0.0.1:{port}", "--data-dir", "{data}/blobs", "--db-path", "{data}/blossom.db", "--allow-insecure-public-http", "--no-rate-limit", "--no-locks", "--admin", "{pubkey}"]
env = { RUST_LOG = "warn" }

[upload]
auth = "url"
bound_auth = true
