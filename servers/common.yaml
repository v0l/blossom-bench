services:
  app:
    network_mode: host
    restart: "no"
    user: "${BB_UID}"
    cpuset: "${BB_SERVER_CPUS}"
    mem_limit: "${BB_MEMORY}"
    memswap_limit: "${BB_MEMORY}"
    working_dir: /data
    volumes: ["${BB_DATA}:/data"]
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}
  aux:
    network_mode: host
    restart: "no"
    cpuset: "${BB_SERVICE_CPUS}"
    mem_limit: "${BB_MEMORY}"
    memswap_limit: "${BB_MEMORY}"
