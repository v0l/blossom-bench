name = "cherry-server"
port = 18106
notes = "0xtrr/cherry-server, Rust, key and mimetype filters off"

[source]
git = "https://github.com/0xtrr/cherry-server.git"

[image]
dockerfile_inline = """
FROM rust:1-bookworm AS build
WORKDIR /src
COPY . .
RUN cargo build --release 
FROM debian:bookworm-slim
RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates libssl3 && rm -rf /var/lib/apt/lists/*
COPY --from=build /src/target/release/cherry-server /usr/local/bin/cherry-server
"""

[[files]]
path = "{data}/config.toml"
content = """
database_directory = '{data}/db'
files_directory = '{data}/blobs'
server_url = 'http://127.0.0.1:{port}'
host = '127.0.0.1:{port}'
[get]
require_auth = false
[upload]
enabled = true
max_size = 2048
[upload.public_key_filter]
enabled = false
mode = "Blacklist"
public_keys = []
[upload.mimetype_filter]
enabled = false
mode = "Blacklist"
mime_types = []
[list]
require_auth = false
[mirror]
enable = false
"""

[run]
cmd = ["cherry-server", "-c", "{data}/config.toml"]
env = { RUST_LOG = "warn" }
