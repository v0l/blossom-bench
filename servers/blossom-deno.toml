name = "blossom-deno"
port = 18103
notes = "hzrd149/blossom-server 6.3.1 on Deno; answers 503 when its upload queue is full"

[source]
git = "https://github.com/hzrd149/blossom-server.git"
rev = "v6.3.1"

[image]
dockerfile = "Dockerfile"

[[files]]
path = "{data}/config.yml"
content = """
port: {port}
host: 127.0.0.1
publicUrl: http://127.0.0.1:{port}
database:
  path: {data}/sqlite.db
storage:
  backend: local
  local:
    dir: {data}/blobs
  removeWhenNoOwners: false
  rules:
    - type: "*"
      expiration: 100 years
upload:
  enabled: true
  requireAuth: true
  maxSize: 2147483648
list:
  enabled: false
mirror:
  enabled: false
media:
  enabled: false
"""

[run]
entrypoint = "deno"
cmd = ["run", "-P", "--config", "/app/deno.json", "/app/main.ts"]
env = { HOME = "{data}" }
startup_timeout_s = 180
