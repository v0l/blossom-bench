name = "haven"
port = 18110
notes = "bitvora/haven (khatru's Blossom package inside a Nostr relay). Blob bytes on disk, metadata in an LMDB event store. Uploads only from the owner key, relay import and web-of-trust sync pointed at an empty relay list"
ready_path = "/"

[source]
git = "https://github.com/barrydeen/haven.git"

[image]
dockerfile_inline = """
FROM golang:1-bookworm AS build
WORKDIR /src
COPY . .
RUN CGO_ENABLED=1 go build -o /out/haven .
FROM debian:bookworm-slim
RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/*
COPY --from=build /out/haven /usr/local/bin/haven
COPY --from=build /src/templates /templates
"""

[[files]]
path = "{data}/relays.json"
content = "[]"

[run]
entrypoint = "sh"
cmd = ["-c", "ln -sfn /templates {data}/templates && exec haven"]
env = { OWNER_NPUB = "{npub}", RELAY_URL = "127.0.0.1:{port}", RELAY_PORT = "{port}", RELAY_BIND_ADDRESS = "127.0.0.1", DB_ENGINE = "lmdb", BLOSSOM_PATH = "{data}/blossom/", PRIVATE_RELAY_NAME = "bench", PRIVATE_RELAY_NPUB = "{npub}", PRIVATE_RELAY_DESCRIPTION = "bench", PRIVATE_RELAY_ICON = "", CHAT_RELAY_NAME = "bench", CHAT_RELAY_NPUB = "{npub}", CHAT_RELAY_DESCRIPTION = "bench", CHAT_RELAY_ICON = "", OUTBOX_RELAY_NAME = "bench", OUTBOX_RELAY_NPUB = "{npub}", OUTBOX_RELAY_DESCRIPTION = "bench", OUTBOX_RELAY_ICON = "", INBOX_RELAY_NAME = "bench", INBOX_RELAY_NPUB = "{npub}", INBOX_RELAY_DESCRIPTION = "bench", INBOX_RELAY_ICON = "", IMPORT_START_DATE = "2024-01-01", IMPORT_SEED_RELAYS_FILE = "{data}/relays.json", BLASTR_RELAYS_FILE = "{data}/relays.json", WOT_DEPTH = "0", LOG_LEVEL = "ERROR" }

[upload]
auth = "std"
