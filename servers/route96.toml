name = "route96"
port = 18101
notes = "built with --features blossom; MariaDB on its own cores"

[source]
git = "https://github.com/v0l/route96.git"

[image]
dockerfile_inline = """
FROM rust:1-bookworm AS build
WORKDIR /src
COPY . .
RUN cargo build --release --no-default-features --features blossom --bin route96
FROM debian:bookworm-slim
RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates libssl3 && rm -rf /var/lib/apt/lists/*
COPY --from=build /src/target/release/route96 /usr/local/bin/route96
"""

[[services]]
name = "mariadb"
image = "mariadb:latest"
args = ["--port=33781", "--bind-address=127.0.0.1"]
env = { MARIADB_ROOT_PASSWORD = "root", MARIADB_DATABASE = "route96" }
ready_cmd = "mariadb -uroot -proot -e 'select 1'"

[[files]]
path = "{data}/config.yaml"
content = """
listen: "127.0.0.1:{port}"
database: "mysql://root:root@127.0.0.1:33781/route96"
storage_dir: "{data}/files"
max_upload_bytes: 4000000000
public_url: "http://127.0.0.1:{port}"
"""

[run]
cmd = ["route96", "--config", "{data}/config.yaml"]
env = { RUST_LOG = "warn" }
