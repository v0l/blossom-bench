name = "blossom-go"
port = 18104
notes = "sebdeveloper6952/blossom-server, Go + gin + SQLite with blobs stored in the database; upload cap raised to 2 GB"

[source]
git = "https://github.com/sebdeveloper6952/blossom-server.git"

[image]
dockerfile_inline = """
FROM golang:1-bookworm AS build
WORKDIR /src
COPY . .
RUN CGO_ENABLED=1 go build -o /out/blossom-go ./cmd/api
FROM debian:bookworm-slim
RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/*
COPY --from=build /out/blossom-go /usr/local/bin/blossom-go
COPY --from=build /src/db/migrations /migrations
"""

[[files]]
path = "{data}/config.yml"
content = """
db_path: "{data}/database.sqlite3"
log_level: "ERROR"
api_addr: "127.0.0.1:{port}"
cdn_url: "http://127.0.0.1:{port}"
admin_pubkey: "509f37d850fa007227688f2d897e8e8efb6af9a4b2bd636bbd74349f9f2c6d89"
max_upload_size_bytes: 2147483648
access_control_rules:
  - action: "ALLOW"
    pubkey: "ALL"
    resource: "UPLOAD"
  - action: "ALLOW"
    pubkey: "ALL"
    resource: "GET"
allowed_mime_types:
  - "*"
"""

[run]
entrypoint = "sh"
cmd = ["-c", "mkdir -p {data}/db && ln -sfn /migrations {data}/db/migrations && exec blossom-go"]
