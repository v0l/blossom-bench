services:
  server:
    extends: {file: ../common.yaml, service: app}
    build:
      context: "https://github.com/0xtrr/cherry-server.git"
      dockerfile_inline: |
        FROM rust:1-bookworm AS build
        WORKDIR /src
        COPY . .
        RUN cargo build --release 
        FROM debian:bookworm-slim
        RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates libssl3 && rm -rf /var/lib/apt/lists/*
        COPY --from=build /src/target/release/cherry-server /usr/local/bin/cherry-server
    image: bb-cherry-server:bench
    command: ["cherry-server", "-c", "/data/config.toml"]
    environment:
      RUST_LOG: "warn"
