database_directory = '/data/db'
files_directory = '/data/blobs'
server_url = 'http://127.0.0.1:${BB_PORT}'
host = '127.0.0.1:${BB_PORT}'
[get]
require_auth = false
[upload]
enabled = true
max_size = 2048
[upload.public_key_filter]
enabled = false
mode = "Blacklist"
public_keys = []
[upload.mimetype_filter]
enabled = false
mode = "Blacklist"
mime_types = []
[list]
require_auth = false
[mirror]
enable = false
