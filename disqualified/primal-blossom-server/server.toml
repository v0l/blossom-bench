name = "primal-blossom-server"
port = 18113
notes = "PrimalHQ/primal-blossom-server, Rust + axum + Postgres. GET answers 302 to a separate media server, so each read is a redirect plus a second request to nginx, and only counts as ok when the final response has the right bytes. Several tables its queries need are missing from its schema.sql and were reconstructed from the SQL. Only text and image content is accepted"
startup_timeout_s = 240
data_dirs = ["media", "tmp", "procgraph"]
follow_redirects = true

[upload]
content = "text"
content_type = "text/plain"
settle_s = 2
